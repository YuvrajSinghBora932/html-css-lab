<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
</head>
<body>
  <h1>Sign-Up Form</h1>

  <form action="#" method="get">
    <label for="name">Full name:</label>
    <input id="name" name="name" type="text" required><br><br>

    <label for="email">Email:</label>
    <input id="email" name="email" type="email" required><br><br>

    <p>Study mode:</p>
    <label><input type="radio" name="mode" value="online" required> Online</label>
    <label><input type="radio" name="mode" value="offline"> Offline</label><br><br>

    <p>Topics:</p>
    <label><input type="checkbox" name="topic" value="html"> HTML</label>
    <label><input type="checkbox" name="topic" value="css"> CSS</label><br><br>

    <label for="year">Year:</label>
    <select id="year" name="year">
      <option value="1">First</option>
      <option value="2">Second</option>
      <option value="3">Third</option>
    </select><br><br>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
