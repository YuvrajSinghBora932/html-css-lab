<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Layouts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: lightblue;
      height: 200px;
    }

    .box {
      background-color: darkblue;
      color: white;
      padding: 20px;
      margin: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Flexbox Layouts</h1>

  <div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>
</body>
</html>
