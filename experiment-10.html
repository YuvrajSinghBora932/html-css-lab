<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Fundamentals</title>
  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: darkblue;
      text-align: center;
    }

    p {
      color: darkgreen;
      font-size: 20px;
    }

    .highlight {
      background-color: yellow;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>CSS Fundamentals</h1>
  <p>This is a paragraph styled using CSS.</p>
  <p class="highlight">This paragraph uses a CSS class.</p>
</body>
</html>
